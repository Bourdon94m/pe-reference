<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PE Reference · structures of the PE format</title>
  <meta name="description" content="Visual reference for the structures of the PE format (winnt.h): IMAGE_DOS_HEADER, IMAGE_NT_HEADERS, sections, imports, exports, relocations… with offsets and color coding.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Crect x='5' y='6' width='22' height='5' rx='1.5' fill='%23fbbf24'/%3E%3Crect x='5' y='13' width='22' height='5' rx='1.5' fill='%23a78bfa'/%3E%3Crect x='5' y='20' width='22' height='6' rx='1.5' fill='%234ade80'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    var LANG = "en";
    try {
      var savedLang = localStorage.getItem("pe-ref-lang");
      if (savedLang === "en" || savedLang === "fr") LANG = savedLang;
    } catch (e) { /* storage unavailable */ }
    document.documentElement.lang = LANG;
    try { if (localStorage.getItem("pe-ref-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) { /* storage unavailable */ }
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <button id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    <a class="logo" href="#overview"><b>PE</b><span>·REF</span></a>
    <div class="grow"></div>
    <div id="arch" class="seg" role="group" aria-label="Architecture"><button data-a="32">PE32</button><button data-a="64" class="on">PE32+</button></div>
    <div id="theme" class="seg" role="group" aria-label="Theme"><button data-th="dark" class="on">Dark</button><button data-th="light">Light</button></div>
    <div id="lang" class="seg" role="group" aria-label="Language"><button data-lg="en" class="on">EN</button><button data-lg="fr">FR</button></div>
    <button id="search" class="sbtn"><span>Search</span><kbd>Ctrl K</kbd></button>
  </header>
  <div class="shell">
    <nav id="nav" aria-label="Pages"></nav>
    <main id="main"></main>
  </div>
  <div id="pal" hidden>
    <div class="palbox">
      <input id="palin" placeholder="Structure, field, constant… (e.g. e_lfanew, IMAGE_SCN, 0x20B)" autocomplete="off" spellcheck="false">
      <div id="palres"></div>
    </div>
  </div>
  <script>
    document.write('<script src="js/data.' + LANG + '.js"><\/script>');
    document.write('<script src="js/tree-data.' + LANG + '.js"><\/script>');
  </script>
  <script src="js/ui-strings.js"></script>
  <script src="js/scene-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
